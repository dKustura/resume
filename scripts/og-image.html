<!doctype html>
<!-- Social preview card (1200×630). Rendered to public/og-image.png by build-cv.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #0a0a0a;
    color: #fafafa;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 96px;
    border-top: 8px solid #34d399;
  }
  img {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #262626;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #34d399;
  }
  h1 { font-size: 76px; font-weight: 600; letter-spacing: -2px; margin-top: 12px; }
  .role { font-size: 34px; color: #a3a3a3; margin-top: 8px; }
  .stack { font-size: 24px; color: #737373; margin-top: 36px; }
  .url { font-size: 24px; color: #fafafa; margin-top: 12px; }
</style>
</head>
<body>
  <img src="../public/avatar.jpeg" alt="">
  <div>
    <div class="eyebrow">Resume</div>
    <h1>Denis Kustura</h1>
    <div class="role">Senior Software Engineer</div>
    <div class="stack">React · TypeScript · Node.js · .NET</div>
    <div class="url">kustura.dev</div>
  </div>
</body>
</html>
